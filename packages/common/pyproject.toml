[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpm-common"
version = "0.1.0"
description = "Tiền xử lý và feature engineering dùng chung cho ml/, services/streaming và services/backend"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[tool.setuptools.packages.find]
include = ["rpm_common*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
