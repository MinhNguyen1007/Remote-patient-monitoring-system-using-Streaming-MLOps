apiVersion: 1

providers:
  - name: RPM
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    # Grafana tự nạp lại khi file JSON trong thư mục thay đổi
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
