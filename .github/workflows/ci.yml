# Chạy các bộ test không cần hạ tầng Kafka/MLflow (xem mục "Test" trong README.md).
# - Test cần dữ liệu MIMIC-III đã tiền xử lý (ml/data/processed/, không nằm trong git) tự bỏ qua.
# - Test backend chạy trên TimescaleDB dựng bằng service container, cùng image với docker-compose.yml.
# - Test E2E (tests/e2e) cần toàn bộ hệ thống thật nên chỉ chạy trên máy phát triển.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: common + ml + streaming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            services/streaming/requirements.txt
      - name: Cài package
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt -r services/streaming/requirements.txt
          pip install --no-deps -e packages/common -e ml -e services/streaming
      - name: Test rpm_common
        working-directory: packages/common
        run: python -m pytest -q
      - name: Test rpm_ml
        working-directory: ml
        run: python -m pytest -q
      - name: Test rpm_streaming
        working-directory: services/streaming
        run: python -m pytest -q

  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.30.0-pg16
        env:
          POSTGRES_USER: rpm_user
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: rpm_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rpm_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: rpm_user
      POSTGRES_PASSWORD: changeme
      MLFLOW_TRACKING_URI: http://localhost:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/backend/requirements.txt
      - name: Cài package
        run: |
          python -m pip install --upgrade pip
          pip install -r services/backend/requirements.txt
          pip install --no-deps -e packages/common
      - name: Test backend
        working-directory: services/backend
        run: python -m pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
