# Run from services/backend/: alembic upgrade head
# DB URL comes from POSTGRES_* env vars (app/db/url.py), never stored here.
# Keep this file ASCII-only: Alembic reads it with the OS locale encoding (cp1252 on Windows).
[alembic]
script_location = app/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
