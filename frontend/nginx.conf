# Phục vụ bản build React; /api (REST + WebSocket /api/ws) chuyển tới backend FastAPI trong mạng docker.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    # WebSocket mang JWT trong query string: không ghi query vào access log
    access_log off;
  }

  location / {
    try_files $uri /index.html;
  }
}
