# Docker Compose - hạ tầng nền + Airflow (DAG drift_check/retrain_pipeline) + service ứng dụng.
# Service ứng dụng (services/backend, services/frontend, services/streaming) nằm trong profile "app".
#
# Chạy: docker compose up -d
# Kiểm tra: docker compose ps

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_db
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  # Mặc định REST API chỉ nhận session cookie; backend cần basic auth để trigger DAG retrain (UC10).
  AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
  # Quét thư mục DAG mỗi 30 giây (mặc định 5 phút) để DAG mới/sửa có hiệu lực nhanh
  AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
  # --- Giai đoạn G: code ML của DAG (venv /opt/rpm-venv trong image) kết nối các service qua hostname docker ---
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC_MLOPS: ${KAFKA_TOPIC_MLOPS:-mlops-events}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  DRIFT_CHECK_INTERVAL_MINUTES: ${DRIFT_CHECK_INTERVAL_MINUTES:-2}

# Image Airflow + venv ML riêng (infra/Dockerfile.airflow); khai báo build ở cả 3 service để service nào lên trước
# cũng không phải kéo image "rpm-airflow" (không có trên registry)
x-airflow-image: &airflow-image
  build:
    context: .
    dockerfile: infra/Dockerfile.airflow
  image: rpm-airflow:latest

services:
  postgres:
    image: timescale/timescaledb:2.30.0-pg16
    container_name: rpm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: rpm_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: rpm_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      # Chỉ publish listener cho host. Listener nội bộ kafka:9092 quảng bá hostname "kafka",
      # host không phân giải được nên không publish ra ngoài.
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  mlflow:
    build:
      context: .
      dockerfile: infra/Dockerfile.mlflow
    container_name: rpm_mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts

  airflow-init:
    <<: *airflow-image
    container_name: rpm_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment: *airflow-env
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db migrate && airflow users create --username ${AIRFLOW_WWW_USER} --password ${AIRFLOW_WWW_PASSWORD} --firstname Admin --lastname User --role Admin --email admin@example.com"

  airflow-webserver:
    <<: *airflow-image
    container_name: rpm_airflow_webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    ports:
      - "8080:8080"
    volumes:
      - ./infra/airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    command: webserver

  # LocalExecutor: task của DAG (kể cả huấn luyện lại model) chạy trong container này
  airflow-scheduler:
    <<: *airflow-image
    container_name: rpm_airflow_scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ./infra/airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      # hourly.parquet (4 nhóm cố định) cho retrain — sinh bởi python -m rpm_ml.data.preprocess, không nằm trong git/image
      - ./ml/data/processed:/opt/rpm/ml/data/processed:ro
    command: scheduler

  # --- Giai đoạn E: backend FastAPI (profile "app"); tự chạy `alembic upgrade head` khi khởi động ---
  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    image: rpm-backend:latest
    container_name: rpm_backend
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AIRFLOW_API_URL: http://airflow-webserver:8080/api/v1
    ports:
      - "8000:8000"

  # --- Giai đoạn F: frontend React (nginx phục vụ bản build, /api → backend) ---
  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    image: rpm-frontend:latest
    container_name: rpm_frontend
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  # --- Giai đoạn D: streaming (profile "app", không chạy cùng `docker compose up -d` hạ tầng) ---
  # Trước khi chạy consumer lần đầu: tạo schema bằng Alembic (cd services/backend && alembic upgrade head).
  stream-consumer:
    build:
      context: .
      dockerfile: services/streaming/Dockerfile
    image: rpm-streaming:latest
    container_name: rpm_stream_consumer
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      mlflow:
        condition: service_started
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MLFLOW_TRACKING_URI: http://mlflow:5000
      POSTGRES_HOST: postgres
    command: ["rpm_streaming.consumer"]

  stream-producer:
    image: rpm-streaming:latest
    container_name: rpm_stream_producer
    profiles: ["app"]
    depends_on:
      - kafka
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      # Dữ liệu phát lại sinh bởi python -m rpm_ml.data.preprocess (không nằm trong git/image)
      - ./ml/data/processed:/app/ml/data/processed:ro
    entrypoint: ["python", "-m", "rpm_streaming.producer"]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: rpm_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.1.4
    container_name: rpm_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning

volumes:
  postgres_data:
  mlflow_artifacts:
  airflow_logs:
  grafana_data:
